name: Study companion checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/validate_content.py
      - run: python scripts/sync_seed.py --check
      - run: python scripts/build_guides.py --check
      - run: python scripts/build_site.py --check
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/*.test.js
      - run: node --check docs/assets/study.js
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s tests/browser -v
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-artifacts
          path: test-results/
