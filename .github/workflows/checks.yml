name: Study companion checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/validate_content.py
      - run: python scripts/sync_seed.py --check
      - run: python scripts/build_guides.py --check
      - run: python -m unittest discover -s tests -v
      - run: node --check docs/assets/study.js
